<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="大富翁卡牌管理系统的浏览器演示，支持检索、筛选、排序和查看详情。">
  <title>卡牌资料库 · Yixuan_Li</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="./catalog.css">
  <script src="./data.js" defer></script>
  <script src="./catalog.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="../"><span class="brand-mark" aria-hidden="true">⌘</span>Yixuan_Li · 项目集</a>
      <a href="../#cards">返回项目</a>
    </div>
  </header>
  <main class="wrap catalog">
    <header class="catalog-intro">
      <p class="eyebrow">大富翁卡牌管理系统</p>
      <h1>卡牌资料库</h1>
      <p>输入卡名或效果，按属性筛选，再打开卡牌看详情。</p>
    </header>
    <section aria-label="卡牌列表">
      <form id="filters" class="filters" role="search">
        <label class="keyword">关键词<input name="keyword" type="search" placeholder="试试 Rent 或 Property"></label>
        <label>类型<select name="type"><option value="">全部类型</option></select></label>
        <label>颜色<select name="color"><option value="">全部颜色</option></select></label>
        <label>稀有度<select name="rarity"><option value="">全部稀有度</option></select></label>
        <label>排序<select name="order">
          <option value="id">编号升序</option>
          <option value="id-desc">编号降序</option>
          <option value="price">价格从低到高</option>
          <option value="price-desc">价格从高到低</option>
          <option value="name">卡名 A–Z</option>
        </select></label>
        <button type="reset" class="button">清除筛选</button>
      </form>
      <p id="result-count" role="status" aria-live="polite"></p>
      <div class="table-wrap" tabindex="0" role="region" aria-label="卡牌数据表">
        <table>
          <thead><tr><th scope="col">编号</th><th scope="col">卡名</th><th scope="col">类型</th><th scope="col">颜色</th><th scope="col">稀有度</th><th scope="col">价格</th></tr></thead>
          <tbody id="card-rows"></tbody>
        </table>
      </div>
      <p id="no-results" hidden>没有符合条件的卡牌。可以换个关键词或清除筛选。</p>
      <noscript><p>请启用 JavaScript 以使用卡牌检索。</p></noscript>
    </section>
  </main>
  <dialog id="card-detail" aria-labelledby="card-name">
    <div class="gallery-toolbar">
      <p class="eyebrow">卡牌详情</p>
      <form method="dialog"><button class="close" aria-label="关闭详情">×</button></form>
    </div>
    <h2 id="card-name"></h2>
    <dl id="card-info"></dl>
  </dialog>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Yixuan_Li 的个人项目集，包含可在线体验的游戏和 Web 应用。">
  <title>Yixuan_Li · 个人项目集</title>
  <link rel="stylesheet" href="./styles.css?v=portfolio-grid">
  <script src="./portfolio.js?v=portfolio-grid" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="./"><span class="brand-mark" aria-hidden="true">⌘</span>Yixuan_Li · 项目集</a>
      <nav aria-label="主导航"><a href="#projects">项目</a><button id="about-button" type="button">关于我</button></nav>
    </div>
  </header>
  <main class="wrap portfolio">
    <h1>个人项目集<span aria-hidden="true">.</span></h1>
    <section class="projects" id="projects" aria-label="项目">
      <article class="project" id="deal" aria-label="大富翁 Deal">
        <button class="project-visual deal-visual" type="button" aria-label="放大截图并查看大富翁 Deal 介绍" aria-haspopup="dialog">
          <img src="./media/deal.webp" alt="大富翁 Deal 的 JavaFX 对局界面" width="1280" height="820">
        </button>
        <div class="project-links">
          <a class="button primary" href="./deal/">在线试玩</a>
          <a class="button" href="https://github.com/lix-6/lix-6.github.io/tree/main/deal" aria-label="查看大富翁 Deal 网页版源码">查看源码</a>
        </div>
        <template>
          <h2 id="project-title">大富翁 Deal</h2>
          <p>通过出牌、收租和交易凑齐三组地产。网页版使用原 Java 规则引擎和机器人，桌面版还支持本地多人和局域网对局。</p>
          <p>Java 17 · JavaFX · TCP · JUnit</p>
          <p>源码链接指向公开的网页版实现。</p>
        </template>
      </article>
      <article class="project" id="frog" aria-label="青蛙过河">
        <button class="project-visual frog-visual" type="button" aria-label="放大截图并查看青蛙过河介绍" aria-haspopup="dialog">
          <img src="./media/frog.webp" alt="青蛙过河的游戏画面" width="600" height="800">
        </button>
        <div class="project-links">
          <a class="button primary" href="./frog/">在线试玩</a>
          <a class="button" href="https://github.com/lix-6/FroggerGame" aria-label="查看青蛙过河源码">查看源码</a>
        </div>
        <template>
          <h2 id="project-title">青蛙过河</h2>
          <p>在倒计时内躲过车流，踩着浮木和乌龟抵达对岸。网页版复用原项目的玩法和画面绘制代码，支持键盘和触屏。</p>
          <p>Java · JavaFX Canvas</p>
        </template>
      </article>
      <article class="project" id="cards" aria-label="大富翁卡牌管理系统">
        <button class="project-visual cards-visual" type="button" aria-label="放大截图并查看大富翁卡牌管理系统介绍" aria-haspopup="dialog">
          <img src="./media/cards.jpg" width="1265" height="712" alt="大富翁卡牌资料库的搜索条件和结果列表">
        </button>
        <div class="project-links">
          <a class="button primary" href="./cards/">在线体验</a>
          <a class="button" href="https://github.com/lix-6/lix-6.github.io/tree/main/cards" aria-label="查看大富翁卡牌管理系统网页版源码">查看源码</a>
        </div>
        <template>
          <h2 id="project-title">大富翁卡牌管理系统</h2>
          <p>按关键词、类型、颜色和稀有度筛选卡牌，并查看效果和价格。原项目用 Servlet 和 JDBC 查询 MySQL，再用 JSP 渲染。在线演示使用浏览器内的卡牌数据。</p>
          <p>Java · JSP · Servlet · MySQL</p>
          <p>源码链接指向公开的网页版实现。</p>
        </template>
      </article>
    </section>
  </main>

  <dialog id="project-detail" class="project-detail" aria-labelledby="project-title">
    <form class="dialog-close" method="dialog"><button class="close" aria-label="关闭项目介绍" autofocus>×</button></form>
    <img id="project-image" alt="">
    <div class="detail-content" id="project-content"></div>
  </dialog>
  <dialog id="about" class="project-detail about" aria-labelledby="about-title">
    <form class="dialog-close" method="dialog"><button class="close" aria-label="关闭关于我" autofocus>×</button></form>
    <h2 id="about-title">关于我</h2>
    <p>我是一名软件工程专业的大三学生，正在寻找寒假软件开发实习。</p>
    <a href="https://github.com/lix-6">GitHub · lix-6</a>
  </dialog>
</body>
</html>
